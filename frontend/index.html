<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苏格拉底式多赛道导师</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- 左侧：品牌 + 新建 + 每赛道对话列表 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">苏格拉底导师</div>
        <div class="brand-sub">只提问 · 不回答</div>
      </div>
      <button id="new-chat" class="new-chat-btn" aria-label="新建对话">+ 新对话</button>
      <nav id="conv-groups" class="conv-groups" aria-label="对话列表"></nav>
      <div class="sidebar-foot">
        <b>小贴士</b>
        点赛道名展开历史对话<br />
        进度按对话独立保存，切换不丢失
      </div>
    </aside>

    <!-- 中间：聊天 -->
    <main class="chat-main is-empty">
      <header class="chat-header">
        <span id="track-title" class="chat-title">苏格拉底导师</span>
        <span class="chat-sub">引导阶段随对话推进</span>
      </header>
      <div class="chat-body">
        <div id="chat" class="chat-scroll"></div>
        <div id="ocr-status" class="ocr-status"></div>
        <footer class="composer">
          <div class="composer-shell">
            <label class="ocr-btn">截图
              <input id="ocr-file" type="file" accept="image/*" hidden />
            </label>
            <input id="input" class="composer-input" type="text" placeholder="说说你卡在哪里…" autocomplete="off" />
            <button id="send" class="send-btn" aria-label="发送">发送</button>
          </div>
        </footer>
      </div>
    </main>

    <!-- 右侧：进度条 + 引导树 -->
    <aside class="progress-panel">
      <div class="panel-title">引导进度</div>
      <div id="progress"></div>
      <div class="panel-hint">
        每完成一轮对话，阶段自动 +1。<br />
        贴代码块会触发运行结果（演示模式为模拟）。
      </div>
    </aside>
  </div>

  <script type="module">
    import { store, newConversation, selectConversation } from "./js/store.js";
    import { sendMessage, openConversation } from "./js/chat.js";
    import { renderTracks, afterNew, afterSelect, expandTrack } from "./js/track.js";
    import { initOcr } from "./js/ocr.js";

    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("new-chat");

    function doSend() {
      const v = input.value;
      if (!v.trim()) return;
      input.value = "";
      sendMessage(v);
    }
    sendBtn.onclick = doSend;
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
    });
    newChatBtn.onclick = () => { newConversation(); afterNew(); };

    // 初始化：有历史就打开第一条；没有就只显示空状态，不自动建空对话
    store.subscribe(() => {
      // 打开某条对话时，自动展开它所属的赛道分组
      const c = store.state.conversations.find((x) => x.id === store.state.activeId);
      if (c) expandTrack(c.track);
      renderTracks();
    });
    if (store.state.conversations.length) selectConversation(store.state.conversations[0].id);
    renderTracks();
    afterSelect();
    initOcr();
  </script>
</body>
</html>
