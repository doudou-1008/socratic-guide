<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苏格拉底式多赛道导师</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- 左侧：赛道切换 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">苏格拉底导师</div>
        <div class="brand-sub">只提问 · 不回答</div>
      </div>
      <nav id="track-bar" class="track-list"></nav>
      <div class="sidebar-foot">进度独立保存<br />切换不丢失</div>
    </aside>

    <!-- 中间：聊天 -->
    <main class="chat-main">
      <header class="chat-header">
        <span id="track-title" class="chat-title">编程排错</span>
        <span class="chat-sub">引导阶段随对话推进</span>
      </header>
      <div id="chat" class="chat-scroll"></div>
      <div id="ocr-status" class="ocr-status"></div>
      <footer class="composer">
        <label class="ocr-btn">
          截图
          <input id="ocr-file" type="file" accept="image/*" hidden />
        </label>
        <input id="input" class="composer-input" type="text" placeholder="说说你卡在哪里…" />
        <button id="send" class="send-btn">发送</button>
      </footer>
    </main>

    <!-- 右侧：进度条 + 引导树 -->
    <aside class="progress-panel">
      <div class="panel-title">引导进度</div>
      <div id="progress"></div>
      <div class="panel-hint">
        每完成一轮对话，阶段自动 +1。<br />
        贴代码块会触发运行结果（演示模式为模拟）。
      </div>
    </aside>
  </div>

  <script type="module">
    import { store, fetchSession } from "./js/store.js";
    import { sendMessage, renderHistory, showEmpty } from "./js/chat.js";
    import { renderTracks } from "./js/track.js";
    import { renderProgress } from "./js/progress.js";
    import { initOcr } from "./js/ocr.js";

    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function doSend() {
      const v = input.value;
      if (!v.trim()) return;
      input.value = "";
      sendMessage(v);
    }
    sendBtn.onclick = doSend;
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        doSend();
      }
    });

    renderTracks();
    renderProgress("programming", 1);
    showEmpty();
    initOcr();

    (async () => {
      const s = await fetchSession(store.state.track);
      store.set({
        stage: { ...store.state.stage, [store.state.track]: s.stage },
        messages: s.history,
      });
      renderProgress(store.state.track, s.stage);
      renderHistory(s.history);
    })();
  </script>
</body>
</html>
